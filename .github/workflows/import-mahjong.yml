name: Publish Mahjong historical versions
on:
  push:
    paths:
      - '.github/workflows/import-mahjong.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Import sanitized source and publish version packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          IMPORT_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error,base64,zipfile,io,hashlib,time,subprocess,tempfile,pathlib
          repo=os.environ['GH_REPO'];base='https://api.github.com/repos/'+repo
          token=os.environ['GH_TOKEN']
          headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def api(method,path,data=None,raw=None):
              url=path if path.startswith('https://') else base+path
              payload=raw if raw is not None else (json.dumps(data).encode() if data is not None else None)
              h=dict(headers)
              if raw is not None:h['Content-Type']='application/zip'
              elif data is not None:h['Content-Type']='application/json'
              req=urllib.request.Request(url,data=payload,headers=h,method=method)
              for attempt in range(6):
                  try:
                      with urllib.request.urlopen(req,timeout=180) as r:
                          b=r.read()
                          return json.loads(b) if b else None
                  except urllib.error.HTTPError as e:
                      if e.code in (429,500,502,503,504) and attempt<5:
                          time.sleep(2**attempt);continue
                      raise
          assert not api('GET','')['private']
          parts=api('GET','/contents/import-parts?ref='+os.environ['IMPORT_SHA'])
          assert len(parts)==10
          payload=b''
          for item in sorted(parts,key=lambda p:p['name']):
              blob=api('GET','/git/blobs/'+item['sha'])
              payload+=base64.b64decode(blob['content'])
          assert hashlib.sha256(payload).hexdigest()=='b41cb0a4db381f927157ec3ed92c52da0adcad476bf0f9e34e31009eb14d8f95'
          bundle=zipfile.ZipFile(io.BytesIO(payload))
          manifest=json.loads(bundle.read('manifest.json'))
          entries=manifest['versions'];assert len(entries)==34
          objects={}
          for e in entries:
              for name,sha in e['files'].items():
                  assert not name.startswith('/') and '..' not in name.split('/')
                  assert not name.startswith('data/') and name!='.env'
                  if sha not in objects:
                      data=bundle.read('objects/'+sha)
                      assert hashlib.sha256(data).hexdigest()==sha
                      objects[sha]=data
          git_env=dict(os.environ)
          git_env.update({'GIT_CONFIG_COUNT':'1','GIT_CONFIG_KEY_0':'http.https://github.com/.extraheader','GIT_CONFIG_VALUE_0':'AUTHORIZATION: basic '+base64.b64encode(('x-access-token:'+token).encode()).decode()})
          root=pathlib.Path(tempfile.mkdtemp())/'project'
          def git(*args):
              p=subprocess.run(['git',*args],cwd=root if root.exists() else None,env=git_env,capture_output=True,text=True)
              if p.returncode:raise RuntimeError(p.stderr)
              return p.stdout.strip()
          git('clone','https://github.com/'+repo+'.git',str(root))
          git('config','user.name','muzhouyi')
          git('config','user.email','251455385+muzhouyi@users.noreply.github.com')
          expected={'v'+e['version'] for e in entries}
          present=set(git('tag','--list').splitlines())
          commits={}
          if not present.intersection(expected):
              for e in entries:
                  git('rm','-rf','--ignore-unmatch','.')
                  for name,sha in e['files'].items():
                      p=root/name;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(objects[sha])
                  git('add','.')
                  git('commit','-m','v'+e['version']+' sanitized historical snapshot')
                  tag='v'+e['version'];git('tag',tag);commits[tag]=git('rev-parse','HEAD')
                  print('Imported '+tag,flush=True)
              git('push','--atomic','origin','main','--tags')
          else:
              assert expected.issubset(present),'Incomplete remote tags require attention'
              for tag in expected:commits[tag]=git('rev-parse',tag)
          for e in entries:
              tag='v'+e['version']
              try:release=api('GET','/releases/tags/'+tag)
              except urllib.error.HTTPError as ex:
                  if ex.code!=404:raise
                  release=api('POST','/releases',{'tag_name':tag,'target_commitish':commits[tag],'name':tag+' · 青桌麻将'+('（首版记录）' if not e['has_source'] else ''),'body':e['notes'],'draft':False,'prerelease':False,'make_latest':'true' if e['version']==manifest['latest'] else 'false'})
              existing={a['name']:a for a in release['assets']}
              for a in e['assets']:
                  buf=io.BytesIO()
                  with zipfile.ZipFile(buf,'w',zipfile.ZIP_DEFLATED) as archive:
                      for name in sorted(a['files']):
                          archive.writestr(name,objects[e['files'][name]])
                  data=buf.getvalue();digest='sha256:'+hashlib.sha256(data).hexdigest()
                  if a['name'] not in existing:
                      url=release['upload_url'].split('{')[0]+'?name='+a['name']
                      asset=api('POST',url,raw=data)
                      assert asset['state']=='uploaded' and asset['size']==len(data) and asset['digest']==digest
                  else:
                      assert existing[a['name']]['state']=='uploaded'
              print('Published '+tag+' with '+str(len(e['assets']))+' packages',flush=True)
          releases=api('GET','/releases?per_page=100')
          bytag={r['tag_name']:r for r in releases}
          assert set(bytag)==expected
          count=0
          for e in entries:
              r=bytag['v'+e['version']]
              assert not r['draft'] and r['body']
              assets={a['name']:a for a in r['assets']}
              for a in e['assets']:
                  assert a['name'] in assets and assets[a['name']]['state']=='uploaded'
                  count+=1
          assert count==60
          assert api('GET','/releases/latest')['tag_name']=='v4.3'
          assert not api('GET','')['private']
          print('Verified public repository, 34 tags and releases, 60 uploaded packages, latest v4.3.')
          PY
