services:
  majiang-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dongguang-mahjong-v25
    restart: unless-stopped
    init: true
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${MAJIANG_PORT:-3019}:3019"
    environment:
      NODE_ENV: production
      PORT: "3019"
      TZ: Asia/Shanghai
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?请在.env中设置ADMIN_PASSWORD}"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    volumes:
      - majiang-data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  majiang-data:
    name: dongguang-mahjong-v25-data
